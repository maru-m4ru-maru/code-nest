<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>Code Nest - Vue Runtime</title>
<style>html,body{margin:0;padding:0;height:100%;background:#fff;font-family:system-ui,sans-serif}#app{padding:12px}#error-overlay{display:none;position:fixed;inset:0;background:#2b0000cc;color:#ffdcdc;padding:16px;font:13px ui-monospace,monospace;white-space:pre-wrap;overflow:auto;z-index:9999}</style>
</head><body><div id="app"></div><div id="error-overlay"></div>
<script>
(function(){
'use strict';
const runtimeRunId=new URLSearchParams(location.search).get('run')||null;const errorBox=document.getElementById('error-overlay'),mountEl=document.getElementById('app');
let currentApp=null,currentCode='',readySent=false,pendingRun=null,loadModule=null;
function post(data){try{parent.postMessage(Object.assign({source:'code-nest-vue',runId:runtimeRunId},data),'*')}catch(_){}}
function showError(err){const m=(err&&err.stack)?err.stack:String(err);errorBox.textContent=m;errorBox.style.display='block';}
function clearError(){errorBox.style.display='none';errorBox.textContent='';}
function safe(v){if(typeof v==='string')return v;try{return JSON.stringify(v)}catch(_){return String(v)}}
['log','warn','error','info'].forEach(level=>{const o=console[level].bind(console);console[level]=(...args)=>{o(...args);post({type:'console',level,args:args.map(safe),runId:pendingRun?.runId||null})}});
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Vueランタイムの読み込みに失敗しました: '+src));document.head.appendChild(s)})}
function options(){return{moduleCache:{vue:Vue},async getFile(){return currentCode},addStyle(t){const s=document.createElement('style');s.textContent=t;document.head.appendChild(s)},log(type,...args){if(type==='error')showError(args.join(' '))}}}
async function boot(){
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js');
    await loadScript('https://cdn.jsdelivr.net/npm/vue3-sfc-loader/dist/vue3-sfc-loader.js');
    if(!window.Vue||!window['vue3-sfc-loader'])throw new Error('Vueランタイムの依存ファイルを読み込めませんでした');
    loadModule=window['vue3-sfc-loader'].loadModule;
    if(typeof loadModule!=='function')throw new Error('vue3-sfc-loaderのloadModuleが見つかりません');
    readySent=true; post({type:'ready'});
    if(pendingRun)runCode(pendingRun.code,pendingRun.runId);
  }catch(err){showError(err);post({type:'error',runId:pendingRun?.runId||null,message:String(err&&err.message||err)})}
}
async function runCode(code,runId){
  pendingRun={code,runId};currentCode=code;
  if(!readySent)return;
  clearError();
  try{
    if(currentApp){currentApp.unmount();currentApp=null;}
    mountEl.innerHTML='';
    const component=await loadModule('cell.vue',options());
    currentApp=Vue.createApp(component);
    currentApp.config.errorHandler=err=>showError(err);
    currentApp.mount(mountEl);
    post({type:'success',runId});
  }catch(err){showError(err);post({type:'error',runId,message:String(err&&err.message||err)})}
}
window.addEventListener('message',ev=>{if(!ev.data||ev.data.type!=='run')return;const incoming=ev.data.runId??null;if(runtimeRunId&&String(incoming)!==String(runtimeRunId))return;runCode(ev.data.code||'',incoming)});
boot();
})();
</script></body></html>
