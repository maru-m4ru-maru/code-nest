<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>Code Nest - React Runtime</title>
<style>html,body{margin:0;padding:0;height:100%;background:#fff;font-family:system-ui,sans-serif}#root{padding:12px}#error-overlay{display:none;position:fixed;inset:0;background:#2b0000cc;color:#ffdcdc;padding:16px;font:13px ui-monospace,monospace;white-space:pre-wrap;overflow:auto;z-index:9999}</style>
</head><body><div id="root"></div><div id="error-overlay"></div>
<script>
(function(){
'use strict';
const runtimeRunId=new URLSearchParams(location.search).get('run')||null;const errorBox=document.getElementById('error-overlay'),rootEl=document.getElementById('root');
let reactRoot=null,readySent=false,pendingRun=null;
function post(data){try{parent.postMessage(Object.assign({source:'code-nest-react',runId:runtimeRunId},data),'*')}catch(_){}}
function showError(err){const m=(err&&err.stack)?err.stack:String(err);errorBox.textContent=m;errorBox.style.display='block';}
function clearError(){errorBox.style.display='none';errorBox.textContent='';}
function safe(v){if(typeof v==='string')return v;try{return JSON.stringify(v)}catch(_){return String(v)}}
['log','warn','error','info'].forEach(level=>{const o=console[level].bind(console);console[level]=(...args)=>{o(...args);post({type:'console',level,args:args.map(safe),runId:pendingRun?.runId||null})}});
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Reactランタイムの読み込みに失敗しました: '+src));document.head.appendChild(s)})}
async function boot(){
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js');
    if(!window.React||!window.ReactDOM||!window.Babel)throw new Error('Reactランタイムの依存ファイルを読み込めませんでした');
    readySent=true; post({type:'ready'});
    if(pendingRun)runCode(pendingRun.code,pendingRun.runId);
  }catch(err){showError(err);post({type:'error',runId:pendingRun?.runId||null,message:String(err&&err.message||err)})}
}
function normalizeReactImports(code){
  return code
    .replace(/import\\s+React\\s*,\\s*\\{([^}]*)\\}\\s*from\\s*["']react["']\\s*;?/g,(m,names)=>names.split(',').map(x=>x.trim()).filter(Boolean).map(name=>{const p=name.split(/\\s+as\\s+/i);return 'const '+(p[1]||p[0])+' = React.'+p[0]+';'}).join('\\n'))
    .replace(/import\\s+\\{([^}]*)\\}\\s*from\\s*["']react["']\\s*;?/g,(m,names)=>names.split(',').map(x=>x.trim()).filter(Boolean).map(name=>{const p=name.split(/\\s+as\\s+/i);return 'const '+(p[1]||p[0])+' = React.'+p[0]+';'}).join('\\n'))
    .replace(/import\\s+React\\s+from\\s*["']react["']\\s*;?/g,'')
    .replace(/import\\s+\\*\\s+as\\s+React\\s+from\\s*["']react["']\\s*;?/g,'')
    .replace(/import\\s+\\{([^}]*)\\}\\s*from\\s*["']react-dom\\/client["']\\s*;?/g,(m,names)=>names.split(',').map(x=>x.trim()).filter(Boolean).map(name=>{const p=name.split(/\\s+as\\s+/i);return 'const '+(p[1]||p[0])+' = ReactDOM.'+p[0]+';'}).join('\\n'))
    .replace(/import\\s+ReactDOM\\s+from\\s*["']react-dom\\/client["']\\s*;?/g,'')
    .replace(/import\\s+\\*\\s+as\\s+ReactDOM\\s+from\\s*["']react-dom\\/client["']\\s*;?/g,'');
}
function runCode(code,runId){
  pendingRun={code,runId};
  if(!readySent)return;
  clearError();
  try{
    const normalized=normalizeReactImports(code);
    const transformed=Babel.transform(normalized,{presets:['react']}).code;
    if(/(^|\\n)\\s*import\\s+/m.test(transformed)){
      throw new Error('未対応のimportです。Reactランタイムでは react / react-dom/client のimportを使用できます。');
    }
    const factory=new Function('React','ReactDOM',transformed+'\n;return (typeof App!=="undefined")?App:null;');
    const App=factory(React,ReactDOM);
    if(!App)throw new Error('App という名前の関数コンポーネントを定義してください。\n例: function App() { return <h1>Hello</h1>; }');
    if(!reactRoot)reactRoot=ReactDOM.createRoot(rootEl);
    reactRoot.render(React.createElement(App));
    post({type:'success',runId});
  }catch(err){showError(err);post({type:'error',runId,message:String(err&&err.message||err)})}
}
window.addEventListener('message',ev=>{if(!ev.data||ev.data.type!=='run')return;const incoming=ev.data.runId??null;if(runtimeRunId&&String(incoming)!==String(runtimeRunId))return;runCode(ev.data.code||'',incoming)});
boot();
})();
</script></body></html>
