name: Apply Code Nest TypeScript patch
on:
  push:
    paths:
      - '.github/workflows/apply-code-nest-ts-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and apply patch
        run: |
          set -euo pipefail
          cat .tmp/patch.part1.b64 .tmp/patch.part2.b64 .tmp/patch.part3.b64 .tmp/patch.part4.b64 | tr -d '\n' | base64 -d | gzip -d > /tmp/code-nest-ts.patch
          test "$(wc -c < /tmp/code-nest-ts.patch)" -eq 58500
          git apply --check /tmp/code-nest-ts.patch
          git apply /tmp/code-nest-ts.patch
          git diff --check
          node --check app.js
          node --check cell-sandbox.js
          node --check loading.js
          node --check preview-fixes.js
          node --check project-idb.js
          node --check typescript-run.js
      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js cell-sandbox.js loading.js preview-fixes.js project-idb.js studio.html typescript-run.js
          git rm .tmp/code-nest-ts-feature.patch.gz.b64 .tmp/patch.part1.b64 .tmp/patch.part2.b64 .tmp/patch.part3.b64 .tmp/patch.part4.b64 .github/workflows/apply-code-nest-ts-patch.yml
          git commit -m 'Add TypeScript support and syntax highlighting'
          git push origin main
