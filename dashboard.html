<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Nest — Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230b1822'/%3E%3Cpath d='M31 10c-9 0-9 6-9 6v8h15v3H19c-9 0-9 8-9 8s0 9 9 9h6v-6h-7c-3 0-3-4 0-4h20c4 0 7-3 7-7V19c0-5-5-9-14-9Z' fill='%2316b9ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css?v=50">
</head>
<body>
<header class="wrap top">
  <a class="brand" href="./">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M31 10c-9 0-9 6-9 6v8h15v3H19c-9 0-9 8-9 8s0 9 9 9h6v-6h-7c-3 0-3-4 0-4h20c4 0 7-3 7-7V19c0-5-5-9-14-9Z" fill="#16b9ff"/><path d="M37 54c9 0 9-6 9-6v-8H31v-3h18c9 0 9-8-9-8s0-9 9-9h-6v6h7c3 0 3 4 0 4H30c-4 0-7 3-7 7v8c0 5 5 9 14 9Z" fill="#078bd7"/></svg>
    <span><strong>Code Nest</strong><small>Notebook Studio · Dashboard</small></span>
  </a>
  <button class="back" id="studioBtn">Studioを開く</button>
</header>
<main class="wrap">
  <section class="hero">
    <div><h1>Dashboard</h1><p>プロジェクトを選んで、続きを開こう。</p></div>
    <div class="hero-actions"><button class="new" id="newProject">＋ 新しいプロジェクト</button></div>
  </section>
  <section class="toolbar" aria-label="プロジェクト操作">
    <input id="projectSearch" class="search" type="search" placeholder="プロジェクトを検索…" autocomplete="off">
    <select id="projectSort" class="sort" aria-label="並び順">
      <option value="order">カスタム順</option>
      <option value="updated">最終更新順</option>
      <option value="name">名前順</option>
    </select>
  </section>
  <section class="projects" id="projects" aria-label="プロジェクト一覧"></section>
</main>
<div class="toast" id="dashboardToast" role="status" aria-live="polite"></div>

<div class="name-modal" id="projectNameModal" hidden>
  <form class="name-dialog" id="projectNameForm">
    <h2 id="projectNameHeading">新しいプロジェクト</h2>
    <p id="projectNameDescription">プロジェクト名を入力してください。</p>
    <label class="name-field" for="projectNameInput">
      プロジェクト名
      <input id="projectNameInput" type="text" maxlength="80" autocomplete="off" spellcheck="false" placeholder="My Project">
    </label>
    <div class="name-actions">
      <button class="name-cancel" type="button" id="projectNameCancel">キャンセル</button>
      <button class="name-submit" type="submit" id="projectNameSubmit">作成</button>
    </div>
  </form>
</div>

<script src="dashboard.js?v=50"></script>
</body>
</html>
