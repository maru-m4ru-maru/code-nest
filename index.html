<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Code Nest — browser Python notebook"><title>Code Nest</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark">&lt;/&gt;</div><div><div class="brand-name">Code Nest</div><div class="brand-sub">browser notebook · v0.1</div></div></div><div class="top-actions"><span id="saveState" class="save-state">Saved</span><button id="themeBtn" class="icon-btn">☾</button><button id="runAllBtn" class="primary-btn">▶ Run all</button></div></header><div class="toolbar"><div class="toolbar-left"><button id="addCodeBtn" class="tool-btn">＋ Code</button><button id="addMarkdownBtn" class="tool-btn">＋ Markdown</button><button id="clearBtn" class="tool-btn muted">Clear outputs</button></div><div class="toolbar-right"><span id="runtimeStatus" class="runtime-status"><span class="status-dot"></span> Python ready on demand</span></div></div><main class="workspace"><section class="notebook-head"><input id="titleInput" class="title-input" value="Welcome to Code Nest"><p>Write Python in cells. Your notebook is saved locally in this browser.</p></section><section id="cells" class="cells"></section><div class="empty-add"><button id="bottomAddBtn" class="add-cell-btn">＋ Add a cell</button></div><footer><span>Code Nest v0.1</span><span>Python runs locally in your browser with Pyodide.</span></footer></main><div id="toast" class="toast"></div><script type="module" src="app.js"></script></body></html>
