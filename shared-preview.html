<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07131d">
<title>Code Nest — Shared Preview</title>
<style>
:root{
  --bg:#07131d;
  --line:#24404e;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
}

body{
  min-height:100vh;
  font-family:Inter,"Noto Sans JP",system-ui,sans-serif;
}

iframe{
  display:block;
  width:100%;
  min-height:100vh;
  height:100vh;
  border:0;
  margin:0;
  background:#fff;
}

.loading{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 12% 0%,#103044 0,transparent 30%),
    radial-gradient(circle at 88% 8%,#201642 0,transparent 28%),
    linear-gradient(180deg,var(--bg),#061018);
  color:#f3f8fb;
  font-family:Inter,"Noto Sans JP",system-ui,sans-serif;
  z-index:10;
}

.loading.hidden{
  display:none;
}

.loading-box{
  text-align:center;
}

.loading-brand{
  font-weight:800;
  font-size:14px;
  color:#9edfff;
}

.loading-text{
  margin-top:10px;
  color:#9cb0bb;
  font-size:12px;
}

.error{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  padding:24px;
  background:
    radial-gradient(circle at 12% 0%,#103044 0,transparent 30%),
    radial-gradient(circle at 88% 8%,#201642 0,transparent 28%),
    linear-gradient(180deg,var(--bg),#061018);
  color:#fff;
  z-index:20;
}

.error.hidden{
  display:none;
}

.error-box{
  width:min(620px,100%);
  padding:24px;
  border:1px solid #713f46;
  border-radius:18px;
  background:#321b20;
  color:#ffb7b7;
  font:13px/1.7 ui-monospace,monospace;
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loading-box">
    <div class="loading-brand">&lt;/&gt; Code Nest</div>
    <div class="loading-text">読み込み中…</div>
  </div>
</div>

<div class="error hidden" id="error">
  <div class="error-box" id="errorText"></div>
</div>

<iframe
  id="previewFrame"
  title="Code Nest Shared Preview"
  referrerpolicy="no-referrer"
></iframe>

<script>
(() => {
  'use strict';

  const params = new URLSearchParams(location.search);
  const id = String(
    params.get('id') || ''
  ).replace(
    /[^a-zA-Z0-9_-]/g,
    ''
  ).slice(0, 80);

  const workerOrigin =
    'https://code-nest-worker.maru-0727.workers.dev';

  const dataUrl = id
    ? `${workerOrigin}/share/${encodeURIComponent(id)}?view=data`
    : '';

  const loading =
    document.getElementById('loading');

  const error =
    document.getElementById('error');

  const errorText =
    document.getElementById('errorText');

  const frame =
    document.getElementById('previewFrame');

  function escapeAttr(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normaliseCells(data) {
    if (
      !data ||
      !Array.isArray(data.cells)
    ) {
      return [];
    }

    return data.cells.map(cell => ({
      type: String(
        cell?.type || 'code'
      ),
      source: String(
        cell?.source || ''
      ),
      output: String(
        cell?.output || ''
      )
    }));
  }

  function buildPreviewHtml(data) {
    const cells =
      normaliseCells(data);

    const htmlCell =
      cells.find(cell => {
        const source =
          cell.source;

        return (
          /<html\b/i.test(source) ||
          /<!doctype\s+html/i.test(source) ||
          /<body\b/i.test(source)
        );
      });

    if (!htmlCell) {
      return `<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Nest Preview</title>
<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#f2f4fb;
  color:#172033;
}
.empty{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}
.card{
  background:#fff;
  border:1px solid #e3e7f0;
  border-radius:18px;
  padding:28px;
  max-width:520px;
  box-shadow:0 12px 40px rgba(31,41,55,.08);
}
</style>
</head>
<body>
<div class="empty">
<div class="card">
<h2>プレビューできるHTMLがありません</h2>
<p>HTML / CSS / JavaScript を含むコードセルを共有してください。</p>
</div>
</div>
</body>
</html>`;
    }

    let source =
      htmlCell.source;

    if (
      !/<!doctype\s+html/i.test(source) &&
      !/<html\b/i.test(source)
    ) {
      source =
        `<!doctype html>` +
        `<html lang="ja">` +
        `<head>` +
        `<meta charset="utf-8">` +
        `<meta name="viewport" content="width=device-width,initial-scale=1">` +
        `<title>${escapeAttr(
          data.title ||
          'Code Nest Preview'
        )}</title>` +
        `</head>` +
        `<body>` +
        source +
        `</body>` +
        `</html>`;
    }

    const css =
      cells
        .filter(
          cell =>
            cell.type === 'css'
        )
        .map(
          cell =>
            `<style>${cell.source}</style>`
        )
        .join('');

    const js =
      cells
        .filter(
          cell =>
            cell.type === 'javascript' ||
            cell.type === 'js'
        )
        .map(
          cell =>
            `<script>${cell.source}<\/script>`
        )
        .join('');

    if (css) {
      if (
        /<\/head>/i.test(source)
      ) {
        source =
          source.replace(
            /<\/head>/i,
            css + '</head>'
          );
      } else {
        source =
          source.replace(
            /<body\b([^>]*)>/i,
            `<head>${css}</head><body$1>`
          );
      }
    }

    if (js) {
      if (
        /<\/body>/i.test(source)
      ) {
        source =
          source.replace(
            /<\/body>/i,
            js + '</body>'
          );
      } else {
        source += js;
      }
    }

    return source;
  }

  function showError(message) {
    loading.classList.add('hidden');
    errorText.textContent =
      String(message);
    error.classList.remove('hidden');
  }

  async function loadPreview() {
    if (!dataUrl) {
      showError(
        '共有IDがありません。正しい共有プレビューURLを開いてください。'
      );
      return;
    }

    try {
      const response =
        await fetch(
          dataUrl,
          {
            method:'GET',
            headers:{
              'Accept':
                'application/json'
            },
            cache:'no-store'
          }
        );

      if (!response.ok) {
        throw new Error(
          `共有データの取得に失敗しました (${response.status})`
        );
      }

      const data =
        await response.json();

      const previewHtml =
        buildPreviewHtml(data);

      frame.removeAttribute(
        'sandbox'
      );

      frame.srcdoc =
        previewHtml;

      frame.addEventListener(
        'load',
        () => {
          loading.classList.add(
            'hidden'
          );
        },
        {
          once:true
        }
      );

      setTimeout(() => {
        loading.classList.add(
          'hidden'
        );
      }, 1500);

    } catch (err) {
      showError(
        err?.message ||
        String(err)
      );
    }
  }

  loadPreview();
})();
</script>

</body>
</html>
