<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07131d">
<title>Code Nest — Shared Preview</title>
<style>
:root{--bg:#07131d;--panel:#0d1e2a;--line:#24404e;--text:#f3f8fb;--muted:#9cb0bb;--blue:#16b9ff;--warn:#f0c878}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,#103044 0,transparent 30%),radial-gradient(circle at 88% 8%,#201642 0,transparent 28%),linear-gradient(180deg,var(--bg),#061018);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
.shell{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0}
.card{max-width:760px;margin:9vh auto 0;background:linear-gradient(145deg,#102431,#0b1b25);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 90px #0009}
.brand{font-weight:800;font-size:13px;color:#9edfff}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px}
h1{margin:22px 0 8px;font-size:28px;letter-spacing:-.03em}.lead{margin:0;color:var(--muted);font-size:13px;line-height:1.8}
.warning{margin:18px 0;padding:16px;border:1px solid #8f6f3d;border-radius:14px;background:#2a2116;color:#f6dfa9;font-size:13px;line-height:1.8;white-space:pre-wrap}
.urlbox{padding:12px;border:1px solid var(--line);border-radius:12px;background:#ffffff05;color:#aebdc5;font:11px/1.6 ui-monospace,monospace;word-break:break-all}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
button{font:inherit}.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:700}.btn.primary{background:linear-gradient(135deg,var(--blue),#078bd7);border-color:transparent;color:#03131d}.btn.warn{border-color:#80513a;background:#341d18;color:#ffd9c0}
.status{margin-left:auto;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:#c6d4db}.status.off{color:#ffb7b7;border-color:#713f46;background:#321b20}
iframe{display:none;width:100%;height:82vh;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 25px 80px #0008}
iframe.visible{display:block}.hidden{display:none!important}
.back{margin-top:12px;text-align:center;color:#6f8793;font-size:10px}
@media(max-width:620px){.card{margin-top:4vh;padding:20px}h1{font-size:24px}.status{margin-left:0}.controls{align-items:stretch}.controls .btn{flex:1}}
</style>
</head>
<body>
<div class="shell">
  <section class="card" id="confirmCard">
    <div class="brand">&lt;/&gt; Code Nest<small>Shared Preview</small></div>
    <h1>このプレビューを実行しますか？</h1>
    <p class="lead">共有されたコードがブラウザで実行されます。意味の分からないコードは実行しないでください。</p>
    <div class="warning" id="warningText"></div>
    <div class="urlbox" id="previewUrl"></div>
    <div class="controls">
      <button class="btn" id="sandboxToggle" type="button">SandboxをOFF</button>
      <button class="btn primary" id="runButton" type="button">▶ 実行</button>
      <span class="status" id="sandboxStatus">Sandbox ON</span>
    </div>
    <div class="back">初期状態ではSandbox ONです。実行しない場合はこのページを閉じてください。</div>
  </section>

  <iframe id="previewFrame" title="Code Nest Shared Preview" referrerpolicy="no-referrer"></iframe>
</div>
<script>
(() => {
  'use strict';

  const params = new URLSearchParams(location.search);
  const rawUrl = params.get('url') || '';
  const allowed = new Set(['code-nest-worker.maru-0727.workers.dev']);
  const WARNING =
    '意味の分からないコードは「絶対に」SandboxOFFで実行しないでください。\n\n' +
    '悪意あるコードだった場合、パスワードなどが流出などの悪影響が生じる可能性が高いです。\n\n' +
    'CodeNest開発者は、そのような行為で生じるいかなる問題の責任を一切負いません。';

  let previewUrl = '';
  try {
    const u = new URL(rawUrl, location.href);
    if (u.protocol !== 'https:' || !allowed.has(u.hostname)) throw new Error('invalid preview');
    previewUrl = u.href;
  } catch (_) {}

  const card = document.getElementById('confirmCard');
  const warning = document.getElementById('warningText');
  const urlEl = document.getElementById('previewUrl');
  const toggle = document.getElementById('sandboxToggle');
  const run = document.getElementById('runButton');
  const status = document.getElementById('sandboxStatus');
  const frame = document.getElementById('previewFrame');

  let sandboxEnabled = localStorage.getItem('codeNest.sharedPreview.sandbox') !== 'off';

  warning.textContent = WARNING;
  urlEl.textContent = previewUrl || '無効なプレビューURLです。';

  function updateUI(){
    status.textContent = sandboxEnabled ? 'Sandbox ON' : 'Sandbox OFF';
    status.classList.toggle('off', !sandboxEnabled);
    toggle.textContent = sandboxEnabled ? 'SandboxをOFF' : 'SandboxをON';
  }

  function confirmOff(){
    return window.confirm(WARNING + '\n\nSandbox OFFで実行しますか？');
  }

  toggle.addEventListener('click', () => {
    if (sandboxEnabled && !confirmOff()) return;
    sandboxEnabled = !sandboxEnabled;
    localStorage.setItem('codeNest.sharedPreview.sandbox', sandboxEnabled ? 'on' : 'off');
    updateUI();
  });

  run.addEventListener('click', () => {
    if (!previewUrl) return;
    if (!sandboxEnabled && !confirmOff()) return;
    frame.removeAttribute('sandbox');
    if (sandboxEnabled) frame.setAttribute('sandbox', 'allow-scripts');
    frame.src = previewUrl;
    frame.classList.add('visible');
    card.classList.add('hidden');
  });

  updateUI();
  if (!previewUrl) { toggle.disabled = true; run.disabled = true; }
})();
</script>
</body>
</html>
